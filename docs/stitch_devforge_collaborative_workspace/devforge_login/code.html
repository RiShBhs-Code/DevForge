<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>DevForge - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Hanken+Grotesk:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#474646",
                        "on-secondary-container": "#b7b4b4",
                        "inverse-primary": "#436900",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-container": "#e5e2e1",
                        "surface-container-low": "#1b1c1c",
                        "surface-container-lowest": "#0d0e0f",
                        "background": "#121414",
                        "surface-container-highest": "#343535",
                        "outline": "#8b947a",
                        "on-surface-variant": "#c0caad",
                        "outline-variant": "#414a34",
                        "tertiary": "#ffffff",
                        "inverse-surface": "#e3e2e2",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#112000",
                        "on-tertiary-fixed-variant": "#474746",
                        "primary-fixed-dim": "#90db00",
                        "surface-container-high": "#292a2a",
                        "on-tertiary-fixed": "#1c1b1b",
                        "surface-bright": "#383939",
                        "on-primary": "#203600",
                        "on-primary-container": "#476f00",
                        "surface-tint": "#90db00",
                        "on-secondary": "#313030",
                        "on-surface": "#e3e2e2",
                        "on-error": "#690005",
                        "primary": "#ffffff",
                        "on-tertiary-container": "#656464",
                        "secondary-fixed-dim": "#c9c6c5",
                        "surface-variant": "#343535",
                        "secondary": "#c9c6c5",
                        "on-secondary-fixed-variant": "#474646",
                        "surface": "#121414",
                        "primary-container": "#a5fa00",
                        "surface-container": "#1f2020",
                        "tertiary-fixed": "#e5e2e1",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "inverse-on-surface": "#303031",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#314f00",
                        "surface-dim": "#121414",
                        "primary-fixed": "#a5fa00",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary": "#313030",
                        "on-background": "#e3e2e2",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "unit": "8px",
                        "margin-mobile": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "body-lg": ["Geist"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Ambient subtle glow for the card container */
        .glow-effect::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: radial-gradient(circle at 50% 0%, rgba(165, 250, 0, 0.15) 0%, transparent 70%);
            z-index: -1;
            border-radius: inherit;
            pointer-events: none;
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1b1c1c inset !important;
            -webkit-text-fill-color: #e3e2e2 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Canvas (No Nav Shell per Transactional Rule) -->
<main class="w-full max-w-[440px] relative glow-effect rounded-xl">
<div class="bg-surface border border-outline-variant rounded-xl p-8 md:p-12 flex flex-col items-center">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-10 w-full text-center">
<div class="mb-6 flex items-center justify-center">
<!-- Minimalist Geometric Logo -->
<svg class="text-primary-container" fill="none" height="48" viewBox="0 0 32 32" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"></path>
<path d="M16 2V16L28 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
<path d="M4 9L16 16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
                    Dev<span class="text-primary-container">Forge</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to your workspace</p>
</div>
<!-- Form Container -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary-container transition-colors pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all shadow-sm" id="email" name="email" placeholder="developer@domain.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary-container transition-colors pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Submit Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-fixed font-headline-md text-body-lg font-bold py-3 px-4 rounded-DEFAULT hover:bg-surface-tint hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Enter Workspace
                        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-8 text-center border-t border-outline-variant/30 pt-6 w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to the forge? 
                    <a class="text-primary-container hover:text-surface-tint hover:underline transition-colors font-medium ml-1" href="#">Create an account</a>
</p>
</div>
</div>
</main>
</body></html>
